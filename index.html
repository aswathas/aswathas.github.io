    <script>
      /*
       * The hero entrance, in three states.
       *
       * `is-entering`  — the hidden start, applied before the first paint.
       * `is-ready`     — the visible end. The transition between them is the
       *                  page's one authored entrance.
       * `is-settled`   — a forced end state. The hero is visible either way.
       *
       * The safety net must never depend on a timer alone: a background tab
       * freezes timers and the compositor, and the transition can sit half
       * finished for as long as the tab is hidden. So the end state is also
       * driven by events that can only fire while the page is alive and
       * attended — load, a visible tab, a first interaction.
       *
       * With JavaScript off, none of the classes exist and the hero renders
       * in its final state. Nothing is ever held hostage by an animation.
       */
      (function () {
        var d = document.documentElement;
        d.classList.add('is-entering');

        var settled = false;

        var settle = function () {
          if (settled) return;
          settled = true;
          d.classList.add('is-settled');
        };

        var go = function () {
          d.classList.remove('is-entering');
          d.classList.add('is-ready');
        };

        var start = function () {
          requestAnimationFrame(go);
          setTimeout(go, 120);
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }

        // The net, in layers.
        setTimeout(settle, 1600);
        window.addEventListener('load', settle);
        window.addEventListener('pageshow', settle);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) settle();
        });
        ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (evt) {
          window.addEventListener(evt, settle, { passive: true });
        });
      })();
    </script>
